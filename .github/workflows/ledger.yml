name: Evidence ledger

on:
  push:
    paths:
      - 'packages/ledger/**'
      - 'evidence/**'
      - '.github/workflows/ledger.yml'
  pull_request:
    paths:
      - 'packages/ledger/**'
      - 'evidence/**'
      - '.github/workflows/ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger-assurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit-test the ledger (signing, revocation, scoped re-verification)
        run: python3 -m unittest discover -s packages/ledger/tests -v
      - name: Reject proof holes and axioms in ledger Lean sources
        run: |
          if grep -nE '^[[:space:]]*(sorry|admit|axiom)[[:space:]]|native_decide' packages/ledger/formal/*.lean; then
            echo 'ERROR: proof holes, axioms and native_decide are forbidden'
            exit 1
          fi
      - name: Install Lean 4 via elan
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-check ledger validity and revocation theorems
        working-directory: packages/ledger
        run: LEAN_PATH=formal lean formal/Ledger.lean

  # Runs every check in evidence/checks.json and signs the results, but only
  # when a signing key is configured as the ARCHITECTON_EVIDENCE_KEY secret and
  # its public key is listed in evidence/allowed_signers as ci@github-actions.
  signed-evidence:
    runs-on: ubuntu-latest
    needs: ledger-assurance
    env:
      SIGNING_KEY: ${{ secrets.ARCHITECTON_EVIDENCE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when no signing key is configured
        if: env.SIGNING_KEY == ''
        run: echo "No ARCHITECTON_EVIDENCE_KEY secret; signed evidence not produced."
      - name: Install Lean 4 via elan
        if: env.SIGNING_KEY != ''
        run: |
          curl -fsSL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@stable
        if: env.SIGNING_KEY != ''
      - name: Run all checks and sign the evidence
        if: env.SIGNING_KEY != ''
        run: |
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/evidence_key"
          python3 packages/ledger/scripts/ledger.py run \
            --key "$RUNNER_TEMP/evidence_key" --principal ci@github-actions
          rm -f "$RUNNER_TEMP/evidence_key"
      - name: Verify the evidence against allowed_signers
        if: env.SIGNING_KEY != ''
        run: python3 packages/ledger/scripts/ledger.py verify
      - name: Publish the signed ledger
        if: env.SIGNING_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: evidence-ledger
          path: evidence/ledger/
