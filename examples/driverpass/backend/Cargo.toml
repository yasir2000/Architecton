[package]
name = "driverpass-poc"
version = "0.1.0"
edition = "2021"
license-file = "../../../LICENSE"
publish = false

[dependencies]
axum = "=0.8.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
